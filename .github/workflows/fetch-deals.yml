name: Fetch NSE/BSE deals

on:
  schedule:
    # NSE market hours are 9:15am - 3:30pm IST (Mon-Fri) = 3:45am - 10:00am UTC.
    # Runs every 15 minutes across that window. Cron is in UTC.
    - cron: '*/15 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'   # catch the ~10:00am IST close
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetcher
        run: python fetch_deals.py --out deals.json --include-bse
        continue-on-error: true   # don't fail the whole workflow if NSE/BSE blocks one run

      - name: Commit updated deals.json
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "Update deals.json [automated]"
          git push
